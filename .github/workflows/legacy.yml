name: Legacy tests
# The legacy tests: every tracked *.test.ts that is neither a unit nor an
# integration file (the critical files, the logic files and
# tests/github/release.test.ts), each spawning a shell script, under the full
# shell matrix. Nightly and on demand only: no push and no release waits for it.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  Tests:
    strategy:
      fail-fast: false
      # A spawned script costs an order of magnitude more on Windows, so its leg
      # splits into 4 jobs by node's own --test-shard.
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
    name: ${{ matrix.os == 'windows-latest' && format('Legacy ({0}, {1}/4)', matrix.os, matrix.shard) || format('Legacy ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: List the legacy test files
        run: |
          git ls-files 'tests/**/*.test.ts' | grep -v -e '\.unit\.test\.ts$' -e '\.integration\.test\.ts$' > legacy-files.txt || true
          [ -s legacy-files.txt ]
      # No path of the list holds a blank, so the unquoted expansion splits it
      # into one argument per file.
      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          CI: "true"
          P2P2_SHELL_MATRIX: full
        run: |
          files=$(cat legacy-files.txt)
          node --test --test-concurrency=12 $files
      - name: Run tests (Windows shard)
        if: matrix.os == 'windows-latest'
        env:
          CI: "true"
          P2P2_SHELL_MATRIX: full
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(cat legacy-files.txt)
          node --test --test-concurrency=8 --test-shard="$SHARD/4" $files
