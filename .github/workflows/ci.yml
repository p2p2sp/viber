name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
# A new run of the same branch or pull request cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  Tests:
    strategy:
      fail-fast: false
      # Linux runs every tier: a spawned script is cheap there. Windows and
      # macOS run the unit and critical tiers only (tests/CLAUDE.md): a spawned
      # script costs an order of magnitude more under Git Bash, so the logic
      # tier would take a Windows job from minutes to a quarter of an hour.
      # The whole suite runs on Windows in full.yml, nightly and before a
      # release.
      matrix:
        include:
          - os: ubuntu-latest
            tiers: all
            files: 12
          - os: windows-latest
            tiers: critical
            files: 6
          - os: macos-latest
            tiers: critical
            files: 6
    name: Tests (${{ matrix.os }}, ${{ matrix.tiers }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guard - each test glob must match at least one file
        run: |
          for pattern in 'tests/**/*.unit.test.ts' 'tests/**/*.critical.test.ts' 'tests/**/*.test.ts'; do
            count=$(git ls-files "$pattern" | wc -l)
            [ "$count" -gt 0 ]
          done
      # --test-concurrency (files at once): the suite spends its time on
      # spawned scripts, so Linux runs more files at once than the runner has
      # cores; Windows and macOS stay close to their core count, where an
      # overloaded runner turns slow cases into timeouts.
      # CI=true turns on the full shell matrix for the critical files
      # (tests/harness/shells.ts): every POSIX shell and every bash major
      # present. A logic file runs under the first shell present.
      - name: Run tests
        env:
          CI: "true"
          TIERS: ${{ matrix.tiers }}
          FILES: ${{ matrix.files }}
        run: |
          if [ "$TIERS" = all ]; then
            node --test --test-concurrency="$FILES" "tests/**/*.test.ts"
          else
            node --test --test-concurrency="$FILES" "tests/**/*.unit.test.ts" "tests/**/*.critical.test.ts"
          fi
