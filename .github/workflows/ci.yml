name: CI

on:
  push:
    paths:
      - "tests/**"
      - "viber/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: node --test "tests/**/*.test.ts"
