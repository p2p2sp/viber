name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  Tests:
    strategy:
      fail-fast: false
      # Every run covers Linux and Windows, where the shell-portability and
      # path-separator assumptions actually get exercised.
      # Windows splits the suite into 4 shards (node --test-shard, one job
      # each): a spawned script costs an order of magnitude more there, so one
      # job would take several times the Linux one.
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
    name: ${{ matrix.os == 'windows-latest' && format('Tests ({0}, {1}/4)', matrix.os, matrix.shard) || format('Tests ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guard - test glob must match at least one file
        run: |
          count=$(git ls-files 'tests/**/*.test.ts' | wc -l)
          [ "$count" -gt 0 ]
      # Runs both tiers: the unit tier (*.unit.test.ts, the only one a
      # developer machine runs) and the integration tier (every other
      # *.test.ts, CI only - see tests/CLAUDE.md).
      # --test-concurrency: the suite spends its time waiting on spawned
      # scripts, not on CPU, so it runs more files at once than the runner has
      # cores. Matters on windows-latest (4 vCPU, default concurrency 3), where
      # process creation is an order of magnitude dearer than on Linux.
      # CI=true turns on the full shell matrix (tests/harness/shells.ts): every
      # POSIX shell and every bash major present, which a local run skips.
      - name: Run tests
        env:
          CI: "true"
          SHARD: ${{ matrix.os == 'windows-latest' && format('{0}/4', matrix.shard) || '1/1' }}
        run: node --test --test-concurrency=12 --test-shard="$SHARD" "tests/**/*.test.ts"
