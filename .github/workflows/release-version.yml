name: Release
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which version part to bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
concurrency:
  group: versioning
  cancel-in-progress: false
jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .github/scripts/retry.sh
          run_id=$(retry gh run list --workflow CI --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No CI run found for commit $GITHUB_SHA: the release needs a CI run of its commit." >&2
            exit 1
          fi
          # No --exit-status: a red CI run must fail at once, not be retried.
          retry gh run watch "$run_id"
          conclusion=$(retry gh run view "$run_id" --json conclusion --jq .conclusion)
          if [ "$conclusion" != success ]; then
            echo "CI run $run_id ended with '$conclusion': the release needs a green CI run." >&2
            exit 1
          fi
      - name: Bump version + create release
        id: bump
        env:
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh "$PART"
      - name: Job summary
        run: echo "${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
